name: Update Live Banner

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - scripts/generate_banner.py
      - .github/workflows/update-banner.yml
      - assets/banner.svg
      - assets/banner.gif
      - README.md
  schedule:
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Pillow
        run: python -m pip install --upgrade pillow
      - name: Generate banner
        env:
          BANNER_NAME: 'Ajesh Krishnan'
          BANNER_TAGLINE: 'Professional Cybersecurity Analyst'
          BANNER_WIDTH: '1200'
          BANNER_HEIGHT: '220'
        run: python scripts/generate_banner.py
      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/banner.svg assets/banner.gif
            git commit -m "chore: update live banner [skip ci]"
            git push
          fi
