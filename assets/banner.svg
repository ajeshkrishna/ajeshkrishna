<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Ajesh Krishnan — Professional Cybersecurity Analyst">
  <defs>
    <linearGradient id="metalText" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1">
        <animate attributeName="stop-color" values="#0EA5E9;#38BDF8;#0EA5E9" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" style="stop-color:#38BDF8;stop-opacity:1">
        <animate attributeName="stop-color" values="#38BDF8;#0EA5E9;#38BDF8" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1">
        <animate attributeName="stop-color" values="#0EA5E9;#0284C7;#0EA5E9" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="metalLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284C7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .name { font: 700 52px -apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Roboto','Helvetica Neue',Arial,sans-serif; fill: url(#metalText); filter: url(#glow); }
      .tagline { font: 400 18px -apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Roboto','Helvetica Neue',Arial,sans-serif; fill: #94A3B8; letter-spacing: 0.5px; }
    </style>
  </defs>
  <rect width="1200" height="220" fill="#0F172A" />
  <rect x="0" y="0" width="1200" height="2" fill="url(#metalLine)" />
  <g transform="translate(50,0)">
    <text x="0" y="102" class="name">Ajesh Krishnan</text>
    <text x="0" y="140" class="tagline">Professional Cybersecurity Analyst</text>
  </g>
</svg>
